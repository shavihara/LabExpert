# Mosquitto Custom Configuration for ESP32 Connectivity
# This configures Mosquitto to listen on all interfaces for ESP32 devices

# Listen on all available network interfaces
listener 1883 0.0.0.0

# Also listen on IPv6
listener 1883 ::

# Allow anonymous connections (required for ESP32 devices)
allow_anonymous true

# Enable logging for debugging
log_dest file mosquitto.log
log_type all

# Connection settings
max_connections -1
persistence true
persistence_location ./

# Security settings (minimal for ESP32 compatibility)
password_file
acl_file

# Protocol options
protocol mqtt

# Keepalive settings
keepalive 60

# Message settings
max_queued_messages 1000
message_size_limit 0

# QoS settings
max_inflight_messages 10
max_inflight_bytes 0
queue_qos0_messages true