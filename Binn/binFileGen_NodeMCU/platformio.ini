[env:esp8266]
platform = espressif8266
board = nodemcuv2  ; Adjust if using a different board, e.g., esp12e
framework = arduino
monitor_speed = 115200
upload_speed = 921600  ; Optional, for faster uploads
lib_deps = 
    bblanchon/ArduinoJson@^6.21.4
    links2004/WebSockets@^2.7.1  ; No trailing quote; use latest version